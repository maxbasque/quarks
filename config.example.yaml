window:
  columns: 3
  theme: dark        # dark | light  (the in-app toggle overrides this per browser)

widgets:
  # --- a plain widget: one feed, one card ---------------------------------
  - type: hackernews
    column: 1
    title: Hacker News
    ttl: 15m
    limit: 25
    # tags: front_page        # or ask_hn / show_hn / story
    # query: rust

  # --- a tab group: several feeds sharing one card ------------------------
  - type: group
    column: 1
    title: Radio-Canada       # optional label shown before the tabs
    tabs:
      - title: À la une
        type: rss
        ttl: 15m
        feeds: [https://ici.radio-canada.ca/info/rss/info/a-la-une]
      - title: En continu
        type: rss
        ttl: 10m
        feeds: [https://ici.radio-canada.ca/info/rss/info/en-continu]

  # YouTube: channel IDs and/or playlist IDs. No "my subscriptions" URL exists
  # (that needs OAuth); export the list once from Google Takeout. Watch Later and
  # Liked can't be fetched at all — use an unlisted playlist instead.
  - type: group
    column: 2
    title: YouTube
    tabs:
      - title: Subs
        type: youtube
        ttl: 30m
        limit: 25
        channels: [UCHnyfMqiRRG1u-2MsSQLbXA]   # start with UC…; interleaved
      - title: Queue
        type: youtube
        ttl: 20m
        playlists: [PLxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx]   # start with PL…

  # Your personalized Reddit home feed — a secret RSS URL from
  # reddit.com/prefs/feeds/, kept in secrets.yaml (see secrets.example.yaml).
  - type: rss
    column: 2
    title: Reddit
    ttl: 20m
    feeds: [ "${secret:reddit_home}" ]
  # Public subreddits instead (adds scores + comment counts, but the .json
  # endpoint is blocked on some networks):
  # - type: reddit
  #   column: 2
  #   title: r/selfhosted
  #   subreddits: [selfhosted, bazzite]
  #   sort: hot

  - type: weather
    column: 3
    title: Montréal
    ttl: 30m
    latitude: 45.50
    longitude: -73.57
    forecast_days: 4

  - type: rss
    column: 3
    title: Lobsters
    ttl: 20m
    feeds: [https://lobste.rs/rss]
