# The dashboard can have several top-level pages — tabs in the title bar.
#
# A page's `columns:` is either a list of named columns (below) or a plain
# count, with each widget placing itself via `column: N`. Named columns can be
# switched on and off from Settings (the gear icon in the header); those
# choices are saved to layout.yaml beside this file and win over `enabled:`.
# `max_columns` (default 3) caps how many show at once; `weight` sets
# relative widths.
#
# Nothing enabled here needs a secret. Niches' Reddit tab reads your
# personalized front page, a private RSS URL from reddit.com/prefs/feeds/ —
# add it as `reddit_home` under Settings → Secrets before turning Niches on.
window:
  theme: dark

pages:
  - name: Accueil
    max_columns: 3
    columns:
      - name: Niches
        enabled: false
        weight: 27
        widgets:
          - type: group
            title: Niches
            tabs:
              - { title: Reddit, type: rss, ttl: 20m, limit: 30, feeds: [ "${secret:reddit_home}" ] }
              - { title: HN, type: hackernews, ttl: 15m, limit: 25 }
              - { title: VGC, type: rss, ttl: 30m, limit: 20, source: VGC,
                  feeds: [https://www.videogameschronicle.com/category/news/feed/] }

      - name: Nouvelles
        weight: 46
        widgets:
          - type: group
            title: Nouvelles
            tabs:
              - { title: À la une, type: rss, ttl: 15m, limit: 25, feeds: [https://ici.radio-canada.ca/info/rss/info/a-la-une] }
              - { title: En continu, type: rss, ttl: 10m, limit: 30, feeds: [https://ici.radio-canada.ca/info/rss/info/en-continu] }
              - { title: Montréal, type: rss, ttl: 15m, limit: 30, feeds: [https://ici.radio-canada.ca/info/rss/grandmontreal/en-continu] }
              - { title: Noovo, type: rss, ttl: 20m, limit: 25, source: Noovo Info, feeds: [https://www.noovo.info/arc/outboundfeeds/rss/] }
              # Front-page + news feeds merged (repeats dropped). The RSS listing
              # doesn't count toward La Presse's weekly article limit.
              - { title: La Presse, type: rss, ttl: 15m, limit: 25, source: La Presse,
                  feeds: [https://www.lapresse.ca/manchettes/rss, https://www.lapresse.ca/actualites/rss] }
              # RC section feeds: …/info/rss/<section>/en-continu
              #   (politique, international, economie, sante, grandmontreal, sports, …)

      - name: Aujourd'hui
        weight: 27
        widgets:
          - type: weather
            title: Montréal
            ttl: 30m
            latitude: 45.50
            longitude: -73.57
            forecast_days: 4

          # Wikimedia Commons "Picture of the Day". lang sets the caption language.
          - type: potd
            title: Photo du jour
            ttl: 6h
            lang: fr

          # Wikipedia "On this day". mode: selected | events | births | deaths
          # | holidays | all
          - type: onthisday
            title: Éphéméride
            ttl: 12h
            limit: 15
            lang: fr
            mode: selected

      - name: Hockey
        enabled: false
        weight: 27
        widgets:
          - type: nhl
            title: Canadiens
            team: MTL
            ttl: 1h
            limit: 12

          - type: nhl
            title: Autour de la ligue
            mode: scores
            ttl: 20m
            limit: 20

  - name: Sports
    columns: 3
    column_weights: [27, 46, 27]   # relative widths; sum to 100 = percentages
    widgets:
      - type: nhl
        column: 1
        title: Canadiens
        team: MTL              # 3-letter team code
        ttl: 1h
        limit: 12

      - type: group
        column: 2
        title: Nouvelles
        tabs:
          - { title: Sports, type: rss, ttl: 20m, limit: 30, feeds: [https://ici.radio-canada.ca/info/rss/sports/en-continu] }
          - { title: Hockey, type: rss, ttl: 20m, limit: 30, feeds: [https://ici.radio-canada.ca/info/rss/sous-theme/hockey] }
          - { title: r/hockey, type: rss, ttl: 1h, limit: 25, feeds: [https://www.reddit.com/r/hockey/.rss] }
          - { title: r/Habs, type: rss, ttl: 1h, limit: 25, feeds: [https://www.reddit.com/r/Habs/.rss] }

      - type: group
        column: 3
        title: Classements
        tabs:
          - { title: NHL, type: standings, league: nhl, group: division, team: MTL, ttl: 2h }
          - { title: MLB, type: standings, league: mlb, ttl: 2h }
          # nhl group: division | conference | league

      - type: nhl
        column: 3
        title: Autour de la ligue
        mode: scores          # recent final scores, all teams
        ttl: 20m
        limit: 20

  # A Media page (upcoming albums from your followed Spotify artists) isn't
  # included by default: connect Spotify from Settings, which then shows the
  # block to paste here.
