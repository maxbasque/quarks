window:
  columns: 3
  theme: dark

widgets:
  - type: hackernews
    column: 1
    title: Hacker News
    ttl: 15m
    limit: 15
    # tags: front_page      # or "ask_hn", "show_hn", "story"
    # query: rust           # optional search term

  - type: rss
    column: 1
    title: Radio-Canada
    ttl: 15m
    limit: 12
    # Verify the current feed URLs against the live site before relying on these.
    feeds:
      - https://ici.radio-canada.ca/rss/4159

  # Your personalized Reddit home feed — a secret RSS URL from
  # reddit.com/prefs/feeds/. Put the URL in secrets.yaml, not here.
  - type: rss
    column: 2
    title: Reddit
    ttl: 20m
    limit: 15
    feeds:
      - "${secret:reddit_home}"

  # Public subreddits (carries scores + comment counts). Note: the reddit .json
  # endpoint is often blocked outside a residential IP.
  # - type: reddit
  #   column: 2
  #   title: r/selfhosted
  #   ttl: 20m
  #   subreddits: [selfhosted, bazzite]
  #   sort: hot

  - type: youtube
    column: 2
    title: YouTube
    ttl: 30m
    limit: 12
    channels:
      - UCXXXXXXXXXXXXXXXXXXXXXX   # channel IDs (start with "UC")

  - type: weather
    column: 3
    title: Montréal
    ttl: 30m
    latitude: 45.50
    longitude: -73.57
    forecast_days: 4
