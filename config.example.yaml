# The dashboard can have several top-level pages — tabs in the title bar.
# For a single page, drop `pages:` and put `widgets:` at the top level, with
# optional `columns` / `column_weights` under `window:`.
pages:
  - name: Home
    columns: 3
    column_weights: [27, 46, 27]  # relative widths; values summing to 100 read as %

    widgets:
      # a plain widget: one feed, one card
      - type: hackernews
        column: 1
        title: Hacker News
        ttl: 15m
        limit: 25

      # a tab group: several feeds sharing one card
      - type: group
        column: 1
        title: Radio-Canada
        tabs:
          - { title: À la une, type: rss, ttl: 15m, feeds: [https://ici.radio-canada.ca/info/rss/info/a-la-une] }
          - { title: En continu, type: rss, ttl: 10m, feeds: [https://ici.radio-canada.ca/info/rss/info/en-continu] }
          # RC section feeds: …/info/rss/<section>/en-continu
          #   (politique, international, economie, sante, grandmontreal, sports, …)

      # personalized Reddit home feed — a secret RSS URL from reddit.com/prefs/feeds/,
      # kept in secrets.yaml (see secrets.example.yaml)
      - type: rss
        column: 2
        title: Reddit
        ttl: 20m
        feeds: [ "${secret:reddit_home}" ]

      - type: youtube
        column: 2
        title: YouTube
        ttl: 30m
        channels: [ UCHnyfMqiRRG1u-2MsSQLbXA ]   # channel IDs (UC…); playlists: [PL…] also works

      - type: weather
        column: 3
        title: Montréal
        ttl: 30m
        latitude: 45.50
        longitude: -73.57
        forecast_days: 4

      - type: rss
        column: 3
        title: Noovo Info
        ttl: 20m
        feeds: [https://www.noovo.info/arc/outboundfeeds/rss/]
        # summary: false        # rss items show a 2-line excerpt by default

      # Wikipedia "On this day" for today's date. Keyless. lang: en | fr | de |
      # sv | pt | ru | es …  mode: selected (curated) | events | births | deaths
      # | holidays | all
      - type: onthisday
        column: 3
        title: Éphéméride
        ttl: 12h
        lang: fr
        mode: selected

      # Wikimedia Commons "Picture of the Day": one full-width image + caption.
      # Keyless. lang sets the caption language (falls back to English).
      - type: potd
        column: 3
        title: Photo du jour
        ttl: 6h
        lang: fr

  - name: Sports
    columns: 2
    column_weights: [1, 1]
    widgets:
      - type: nhl
        column: 1
        title: Canadiens
        team: MTL              # 3-letter team code
        ttl: 1h
        limit: 12

      - type: group
        column: 2
        title: Standings
        tabs:
          - { title: NHL, type: standings, league: nhl, group: division, team: MTL, ttl: 2h }
          - { title: MLB, type: standings, league: mlb, ttl: 2h }
          # nhl group: division | conference | league

      - type: nhl
        column: 2
        title: Around the league
        mode: scores          # recent final scores, all teams
        ttl: 20m

  # Upcoming releases from your followed Spotify artists, albums and EPs kept
  # as separate tabs (true singles are filtered out entirely). Connect Spotify
  # from the in-app Settings page (the gear icon in the header) — it writes
  # spotify_client_id / spotify_client_secret / spotify_refresh_token to
  # secrets.yaml for you and shows you this exact block to paste in. The
  # actual API polling is shared between the two tabs and stays gentle on
  # Spotify's rate limit regardless of how many artists you follow — see
  # internal/providers/spotify for how.
  - name: Media
    columns: 1
    widgets:
      - type: group
        title: Music
        column: 1
        tabs:
          - title: Albums
            type: spotify
            include: album
            ttl: 15m
            client_id: "${secret:spotify_client_id}"
            client_secret: "${secret:spotify_client_secret}"
            refresh_token: "${secret:spotify_refresh_token}"
          - title: EPs
            type: spotify
            include: eps
            ttl: 15m
            # ep_min_tracks: 3, ep_max_tracks: 7 by default — Spotify has no
            # native "EP" concept, so this is a track-count heuristic; tune it
            # here if it's misclassifying releases you follow.
            client_id: "${secret:spotify_client_id}"
            client_secret: "${secret:spotify_client_secret}"
            refresh_token: "${secret:spotify_refresh_token}"
