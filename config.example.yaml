# The dashboard can have several top-level pages — tabs in the title bar.
# For a single page, drop `pages:` and put `widgets:` at the top level, with
# optional `columns` / `column_weights` under `window:`.
pages:
  - name: Home
    columns: 3
    column_weights: [27, 46, 27]  # relative widths; values summing to 100 read as %

    widgets:
      # a plain widget: one feed, one card
      - type: hackernews
        column: 1
        title: Hacker News
        ttl: 15m
        limit: 25

      # a tab group: several feeds sharing one card
      - type: group
        column: 1
        title: Radio-Canada
        tabs:
          - { title: À la une, type: rss, ttl: 15m, feeds: [https://ici.radio-canada.ca/info/rss/info/a-la-une] }
          - { title: En continu, type: rss, ttl: 10m, feeds: [https://ici.radio-canada.ca/info/rss/info/en-continu] }
          # RC section feeds: …/info/rss/<section>/en-continu
          #   (politique, international, economie, sante, grandmontreal, sports, …)

      # personalized Reddit home feed — a secret RSS URL from reddit.com/prefs/feeds/,
      # kept in secrets.yaml (see secrets.example.yaml)
      - type: rss
        column: 2
        title: Reddit
        ttl: 20m
        feeds: [ "${secret:reddit_home}" ]

      - type: youtube
        column: 2
        title: YouTube
        ttl: 30m
        channels: [ UCHnyfMqiRRG1u-2MsSQLbXA ]   # channel IDs (UC…); playlists: [PL…] also works

      - type: weather
        column: 3
        title: Montréal
        ttl: 30m
        latitude: 45.50
        longitude: -73.57
        forecast_days: 4

      - type: rss
        column: 3
        title: Noovo Info
        ttl: 20m
        feeds: [https://www.noovo.info/arc/outboundfeeds/rss/]
        # summary: false        # rss items show a 2-line excerpt by default

  - name: Sports
    columns: 2
    column_weights: [1, 1]
    widgets:
      - type: nhl
        column: 1
        title: Canadiens
        team: MTL              # 3-letter team code
        ttl: 1h
        limit: 12

      - type: group
        column: 2
        title: Standings
        tabs:
          - { title: NHL, type: standings, league: nhl, group: division, team: MTL, ttl: 2h }
          - { title: MLB, type: standings, league: mlb, ttl: 2h }
          # nhl group: division | conference | league

      - type: nhl
        column: 2
        title: Around the league
        mode: scores          # recent final scores, all teams
        ttl: 20m
