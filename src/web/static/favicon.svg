<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="34%" cy="28%" r="95%">
      <stop offset="0" stop-color="#2b3a72"/>
      <stop offset="0.55" stop-color="#161d38"/>
      <stop offset="1" stop-color="#0b0e1a"/>
    </radialGradient>
    <linearGradient id="planet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cc0ff"/>
      <stop offset="1" stop-color="#4a7ce0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#sky)"/>

  <!-- ring (back half) -->
  <g transform="rotate(-24 256 264)">
    <ellipse cx="256" cy="264" rx="205" ry="62" fill="none" stroke="#b9ccf2" stroke-width="17" opacity="0.8"/>
  </g>

  <!-- planet -->
  <circle cx="256" cy="264" r="118" fill="url(#planet)"/>
  <path d="M145 300a118 118 0 0 0 222 0 118 118 0 0 1 -222 0z" fill="#35529f" opacity="0.38"/>
  <circle cx="212" cy="222" r="20" fill="#c8dbff" opacity="0.5"/>

  <!-- ring (front half), crossing over the planet -->
  <path d="M69 348 A205 62 -24 0 0 443 181" fill="none" stroke="#eaf1ff" stroke-width="17" stroke-linecap="round"/>

  <!-- stars -->
  <g fill="#e4ecff">
    <path d="M404 112l11 28 28 11-28 11-11 28-11-28-28-11 28-11z"/>
    <path d="M112 150l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/>
    <circle cx="436" cy="326" r="6"/>
    <circle cx="92" cy="386" r="5"/>
  </g>
</svg>
