# Copy to ~/.config/quarks/secrets.yaml and `chmod 600` it.
# Referenced from config.yaml as ${secret:key}. Environment variables work too,
# as ${VAR}. Quote the token in config; values must not contain a double quote.
#
# Treat every URL here as a real credential — anyone holding one can read your
# feed or calendar without logging in. Never commit this file.

# Your Reddit home feed — reddit.com/prefs/feeds/ → "RSS" next to "front page".
reddit_home: "https://www.reddit.com/.rss?feed=XXXXXXXX&user=YOURNAME"

# A private calendar ICS link (Google / Proton / Nextcloud all expose one).
# calendar_personal: "https://calendar.google.com/calendar/ical/.../basic.ics"

# Spotify — normally you never hand-edit these. Open the app's Settings page
# (gear icon in the header), paste in a Client ID/Secret from
# developer.spotify.com/dashboard, and click Connect; it writes all three
# keys here for you, including refresh_token from the OAuth flow.
# spotify_client_id: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# spotify_client_secret: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# spotify_refresh_token: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
